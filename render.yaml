services:
  - type: web
    name: telepizza-api
    runtime: docker
    dockerfilePath: ./backend/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "4000"
      - key: API_CORS_ORIGIN
        value: https://telepizza-rose.vercel.app
      - key: API_JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false